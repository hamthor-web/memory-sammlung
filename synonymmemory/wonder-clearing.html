<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Lichtung der Wunderwesen</title><style>header{display:none!important}:root{--textzoom:1}.caption{font-size:calc(20px * var(--textzoom))!important}html,body{overflow-x:hidden}select[hidden],.controls[hidden]{display:none!important}header,footer{padding:14px 18px}header h1{font-size:clamp(25px,4vw,38px)}
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff3d9;font:20px/1.45 system-ui,sans-serif}header,footer{max-width:1250px;margin:auto;padding:20px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font:700 clamp(27px,4vw,44px)/1.1 Georgia;margin:6px 0}p{margin:6px 0;color:#d8d6e8}.eyebrow{color:#e8bd70;font-size:16px;letter-spacing:.12em}button,select{font:inherit;min-height:52px;border-radius:16px;padding:10px 20px;border:1px solid #8c87a4;color:#fff3d9;background:#27324a;cursor:pointer}button:focus-visible,select:focus-visible{outline:4px solid #ffd27b}button.primary{background:#ffd07b;color:#241f30;border:0;font-weight:750}button:disabled{opacity:.55;cursor:default}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}main{max-width:1250px;margin:auto;padding:0 20px}.scene-wrap{overflow:auto;border-radius:25px;border:1px solid #6c6176;background:#172037}.scene{position:relative;width:100%;aspect-ratio:1.6;min-width:340px;background:url('wonder-assets/forest.jpg') center/cover;isolation:isolate}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(#10182705,#10182710 40%,#10182770)}.creature{position:absolute;width:18%;height:30%;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 0 3px #fff7cb) drop-shadow(0 5px 9px #071326);object-fit:contain}.creature.arriving{z-index:10}.creature{cursor:pointer;transform-origin:center bottom;animation:breathe 4s ease-in-out infinite;animation-delay:var(--delay,0s)}.creature:nth-of-type(3n){animation-name:sway}.creature:nth-of-type(4n){animation-name:floaty}.creature:focus-visible{outline:4px solid #ffe29a;border-radius:24px}.creature.arriving,.creature.greeting{animation:none}.creature.greeting{z-index:9}.creature.knuff-spin{transform-origin:center center}.spark{position:absolute;z-index:11;color:#fff2a1;text-shadow:0 0 9px #ffbf47,0 0 3px white;font-size:clamp(24px,4vw,46px);pointer-events:none}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035,1.055)}}@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,-50%) rotate(3deg)}}@keyframes floaty{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 9px))}}@media(prefers-reduced-motion:reduce){.creature{animation:none}}.status{position:absolute;top:14px;left:14px;background:#101827df;border:1px solid #ba9c66;border-radius:14px;padding:7px 15px;font-weight:bold}.caption{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#101827e8;border-radius:20px;padding:8px 22px;white-space:nowrap;z-index:20;font-weight:650}.score{display:none;gap:12px;margin:12px 0}.score span{background:#29344c;border:1px solid #a4a2bd;border-radius:15px;padding:10px 18px;flex:1}footer{padding-top:16px}.controls{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.zooms{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:18px}label{display:flex;align-items:center;gap:8px}input{width:110px}#message{min-height:32px;margin-top:12px;color:#f9dba6}small{font-size:16px;color:#b9bbcd}@media(max-width:600px){header{padding:16px}main{padding:0 10px}.scene{aspect-ratio:.8;min-width:300px}.creature{width:29%;height:21%}.caption{font-size:17px;max-width:95%;white-space:normal;text-align:center;width:max-content}.controls button.primary{flex:1}.score{font-size:18px}.score span{padding:10px}.eyebrow{font-size:14px}footer{padding:16px}select{max-width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><header><div><div class="eyebrow">DEINE WUNDERWESEN</div><h1>Die Lichtung der Wunderwesen</h1><p>Nach jeder Runde zieht ein neues Wesen ein.</p></div><select hidden id="mode" aria-label="Spielmodus"><option value="solo">Allein spielen</option><option value="two">Zu zweit spielen</option></select></header><main><div class="score" id="score"><span>Kind 1 · <b>7 Paare</b></span><span>Kind 2 · <b>5 Paare</b></span></div><div class="scene-wrap"><div class="scene" id="scene"><div class="status" id="count">0 von 10</div><div class="caption" id="caption">Wer zieht wohl zuerst ein?</div></div></div></main><footer><div class="controls" hidden><button class="primary" id="next">Nächstes Element ✨</button><button id="reset">Von vorn</button></div><p id="message" aria-live="polite">Tippe ein Wesen an oder fahre mit der Maus darüber: Es begrüßt dich an seinem Platz.</p><div class="zooms"><label>Bildgröße <input id="boardZoom" type="range" min="100" max="170" value="100"></label><label>Schriftgröße <input id="fontZoom" type="range" min="100" max="150" value="100"></label></div></footer><script>
const names=['Funkel, der kleine Drache','Luna, die Zaubereule','Milo, das Waldkaninchen','Pippa, der Blütenigel','Fina, der goldene Fuchs','Knuff, das Wolkenwesen','Mo, die Moosschildkröte','Stella, das kleine Einhorn','Pünktchen, das Pilzwesen','Flirr, der Sonnenschmetterling'];
const wide=[[30,70],[14,48],[68,72],[85,52],[49,76],[51,46],[14,82],[86,83],[72,40],[34,25]];
const tall=[[50,68],[17,45],[80,67],[18,84],[78,85],[50,47],[20,64],[80,45],[29,28],[69,27]];
let count=0,busy=false,run=0;const scene=document.getElementById('scene'),next=document.getElementById('next'),caption=document.getElementById('caption'),message=document.getElementById('message');function place(){const pos=scene.clientWidth/scene.clientHeight<1?tall:wide;scene.querySelectorAll('.creature').forEach((el,i)=>{el.style.left=pos[i][0]+'%';el.style.top=pos[i][1]+'%'})}new ResizeObserver(place).observe(scene);

let replayBusy=false;
async function fly(el,i){
 const box=scene.getBoundingClientRect(),pos=(scene.clientWidth/scene.clientHeight<1?tall:wide)[i];
 const dx=box.width*(.5-pos[0]/100),dy=box.height*(.5-pos[1]/100);
 el.classList.add('arriving');caption.textContent=names[i];
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const anim=el.animate([{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+100}px)) scale(.2)`,opacity:0,offset:0},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(2.1) rotate(-5deg)`,opacity:1,offset:.23},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(2.1) rotate(5deg)`,opacity:1,offset:.48},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(2.1) rotate(0deg)`,opacity:1,offset:.63},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:1}],{duration:reduced?150:1000,easing:'ease-in-out'});
 await anim.finished.catch(()=>{});el.classList.remove('arriving');el.lastFlight=Date.now();
}
const localMoves=[
 [{r:0,y:0,sx:1,sy:1},{r:0,y:0,sx:1.14,sy:1},{r:0,y:0,sx:1.02,sy:1},{r:0,y:0,sx:1.08,sy:1},{r:0,y:0,sx:1,sy:1}],
 [{r:0,y:0,sx:1,sy:1},{r:-14,y:-8,sx:1,sy:1},{r:14,y:-8,sx:1,sy:1},{r:-8,y:0,sx:1,sy:1},{r:0,y:0,sx:1,sy:1}],
 [{r:0,y:0,sx:1,sy:1},{r:0,y:-22,sx:.94,sy:1.08},{r:0,y:0,sx:1.08,sy:.9},{r:0,y:-12,sx:.98,sy:1.04},{r:0,y:0,sx:1,sy:1}],
 [{r:0,y:0,sx:1,sy:1},{r:-9,y:0,sx:1.1,sy:.96},{r:9,y:0,sx:1.1,sy:.96},{r:-5,y:0,sx:1,sy:1},{r:0,y:0,sx:1,sy:1}]
];
function sparkle(el,i){const pos=(scene.clientWidth/scene.clientHeight<1?tall:wide)[i];for(let k=0;k<9;k++){const star=document.createElement('span');star.className='spark';star.textContent=k%2?'✧':'✦';star.setAttribute('aria-hidden','true');star.style.left=pos[0]+'%';star.style.top=pos[1]+'%';scene.append(star);const angle=k/9*Math.PI*2,dx=Math.cos(angle)*scene.clientWidth*.1,dy=Math.sin(angle)*scene.clientHeight*.11;const a=star.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:0},{transform:`translate(calc(-50% + ${dx*.7}px),calc(-50% + ${dy*.7}px)) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.3)`,opacity:0}],{duration:1300,delay:k*65,easing:'ease-out'});a.finished.then(()=>star.remove()).catch(()=>star.remove())}}
async function perform(el,i){caption.textContent=names[i];if(busy||replayBusy||!el.isConnected)return;replayBusy=true;next.disabled=true;const token=run;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;message.textContent=names[i]+' begrüßt dich!';el.classList.add('greeting');if(!reduced)sparkle(el,i);let frames=localMoves[i%4].map(f=>({transform:`translate(-50%,calc(-50% + ${f.y}px)) rotate(${f.r}deg) scale(${f.sx},${f.sy})`,filter:'drop-shadow(0 0 8px #ffe3a3) drop-shadow(0 5px 9px #071326)'}));if(i===5){el.classList.add('knuff-spin');frames=[{transform:'translate(-50%,-50%) rotate(0deg) scale(1)'},{transform:'translate(-50%,-50%) rotate(90deg) scale(.9)'},{transform:'translate(-50%,-50%) rotate(180deg) scale(.78)'},{transform:'translate(-50%,-50%) rotate(270deg) scale(.9)'},{transform:'translate(-50%,-50%) rotate(360deg) scale(1)'}]}const anim=el.animate(frames,{duration:reduced?150:(i===5?2200:1800),easing:'ease-in-out'});try{await anim.finished}catch{}finally{el.classList.remove('greeting','knuff-spin');el.lastFlight=Date.now();replayBusy=false;if(token===run){next.disabled=count===10;message.textContent='Wesen berühren: Name, Bewegung und Funkeln am Platz.'}}}
next.onclick=async()=>{if(busy||replayBusy||count===10)return;busy=true;next.disabled=true;let token=run,i=count++;const el=document.createElement('img');el.src='wonder-assets/creature-'+i+'.png';el.alt=names[i];el.className='creature arriving';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',names[i]+' – Bewegung am Platz wiederholen');el.title=names[i];el.style.setProperty('--delay',(-i*.47)+'s');el.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch' && Date.now()-(el.lastFlight||0)>1200)perform(el,i)});el.addEventListener('click',()=>perform(el,i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();perform(el,i)}});el.addEventListener('focus',()=>{caption.textContent=names[i]});scene.append(el);place();caption.textContent=names[i];document.getElementById('count').textContent=count+' von 10';message.textContent='Ein neues Wunderwesen für deine Sammlung!';await el.decode().catch(()=>{});if(token!==run)return;await fly(el,i);if(token!==run)return;el.classList.remove('arriving');busy=false;next.disabled=count===10;next.textContent=count===10?'Sammlung vollständig ✓':'Nächstes Element ✨';message.textContent=count===10?'Alle zehn Wunderwesen sind angekommen!':'Bereit für den nächsten Durchgang.';perform(el,i);};document.getElementById('reset').onclick=()=>{run++;scene.querySelectorAll('.creature,.spark').forEach(el=>el.remove());count=0;busy=false;next.disabled=false;next.textContent='Nächstes Element ✨';document.getElementById('count').textContent='0 von 10';caption.textContent='Wer zieht wohl zuerst ein?';message.textContent='Ein Klick entspricht einem abgeschlossenen Durchgang.'};document.getElementById('mode').onchange=e=>{document.getElementById('score').style.display=e.target.value==='two'?'flex':'none'};document.getElementById('boardZoom').oninput=e=>{scene.style.width=e.target.value+'%'};document.getElementById('fontZoom').oninput=e=>(document.documentElement.style.setProperty('--textzoom',e.target.value/100),document.body.style.fontSize=20*e.target.value/100+'px');

function collectedCreature(i){const el=document.createElement('img');el.src='wonder-assets/creature-'+i+'.png';el.alt=names[i];el.className='creature arriving';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',names[i]+' – Bewegung am Platz wiederholen');el.title=names[i];el.style.setProperty('--delay',(-i*.47)+'s');el.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch' && Date.now()-(el.lastFlight||0)>1200)perform(el,i)});el.addEventListener('click',()=>perform(el,i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();perform(el,i)}});el.addEventListener('focus',()=>{caption.textContent=names[i]});scene.append(el);place();return el;}
const params=new URLSearchParams(location.search);const total=Math.max(0,Math.min(10,Number(params.get('count'))||0));const fresh=params.get('new')==='1'&&total>0;
count=fresh?total-1:total;
for(let i=0;i<count;i++){const el=collectedCreature(i);el.classList.remove('arriving');}
document.getElementById('count').textContent=count+' von 10';caption.textContent=count===10?'Alle zehn Wunderwesen sind angekommen!':count?'Deine Wunderwesen warten auf dich.':'Hier zieht nach jeder Runde ein Wesen ein.';
if(fresh)next.onclick();
function reportSize(){parent.postMessage({type:'syn-wonder-height',height:Math.ceil(document.documentElement.scrollHeight)},location.origin);}
new ResizeObserver(reportSize).observe(document.body);addEventListener('load',reportSize);addEventListener('resize',reportSize);
</script></html>
