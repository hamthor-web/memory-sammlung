<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f9e7e4"><title>Dein rosa Zauberbaum</title>
<style>
*{box-sizing:border-box}html{font-size:20px}body{margin:0;background:#fbf4e8;color:#543746;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #6b427b;outline-offset:4px}header{text-align:center;padding:18px 16px 8px}h1{font-family:Georgia,serif;font-size:clamp(1.5rem,4vw,2rem);font-weight:normal;margin:0 0 7px}header p{margin:0;font-size:1rem;line-height:1.4}.toolbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px 28px;padding:12px 16px}.control{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.9rem}.control input{width:125px;accent-color:#a75883;min-height:38px}.control output{min-width:48px}.canvas-wrap{overflow:auto;max-height:calc(100svh - 260px);min-height:220px;margin:0 auto;width:100%;overscroll-behavior:contain}.scene{position:relative;aspect-ratio:8/9;width:var(--scene-width,550px);margin:0 auto;background:url('assets/bluetenbaum.webp') center/100% 100% no-repeat;border-radius:24px;isolation:isolate;overflow:hidden}.item{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1%);aspect-ratio:4/5;transform:translate(-50%,-50%);padding:0;border:0;background:none;visibility:hidden;filter:drop-shadow(0 2px 2px #5d294329);touch-action:manipulation;z-index:2}.item.visible{visibility:visible}.sprite{width:100%;height:100%;display:block;background-image:url('assets/zauberdinge.webp');background-size:500% 200%;background-position:var(--bx) var(--by);background-repeat:no-repeat;transform-origin:50% 70%;pointer-events:none}.item::after{content:'';position:absolute;inset:-8px;border-radius:50%;pointer-events:none}.item:focus-visible{outline-offset:0}.item.active .sprite{animation:greeting 1.4s ease-in-out}.item[data-id="door"]{perspective:500px}.item[data-id="door"] .sprite{transform-origin:20% 50%;transition:transform .7s ease}.item[data-id="door"].open .sprite{transform:rotateY(-72deg)}.door-light{position:absolute;inset:22% 20% 12%;border-radius:50% 50% 12% 12%;background:radial-gradient(ellipse,#fffde1 15%,#ffe27b 50%,#f2a83c 80%);box-shadow:0 0 22px 14px #ffda6c90;opacity:0;transition:opacity .6s;z-index:-1}.open .door-light{opacity:1;animation:glow 2s ease-in-out infinite}.spark{position:absolute;pointer-events:none;color:#fff5bc;text-shadow:0 0 6px #e595d0;font-size:clamp(14px,2vw,28px);z-index:6;animation:spark 1.6s ease-out forwards}.bottom{text-align:center;padding:12px 16px 20px;background:#fbf4e8}.status{min-height:2.8em;margin:0 auto 8px;max-width:700px;font-size:1rem;line-height:1.4}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button.primary,button.secondary{min-height:56px;border-radius:18px;padding:12px 24px;border:2px solid #ac7693;font-weight:bold;font-size:1rem}button.primary{background:linear-gradient(#f5d6e5,#e8b4cf);color:#553044;box-shadow:0 3px 0 #bd8da7}button.secondary{background:#fffaf1;color:#644253}button:disabled{cursor:default;opacity:.55}.progress{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 10px;font-size:.95rem}.dots{display:flex;gap:5px}.dot{height:10px;width:10px;border-radius:50%;background:#e5d6d9}.dot.done{background:#a45f87;box-shadow:0 0 5px #dba7c9}.veil{position:fixed;inset:0;background:#3c254a45;z-index:30;pointer-events:none;opacity:0;transition:opacity .25s}.veil.show{opacity:1}.discovery{position:fixed;z-index:31;pointer-events:none;filter:drop-shadow(0 8px 18px #45264850)}.discovery-title{position:fixed;z-index:32;left:50%;transform:translateX(-50%);max-width:92vw;text-align:center;background:#fff8ee;color:#5d3650;padding:10px 20px;border:2px solid #d3a1bb;border-radius:18px;font-family:Georgia,serif;font-size:1.2rem;pointer-events:none;white-space:nowrap}.help{font-size:.9rem;margin:14px 0 0;line-height:1.4;color:#6e5362}@keyframes greeting{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-8deg) scale(1.1)}65%{transform:rotate(7deg) scale(1.06)}}@keyframes glow{50%{filter:brightness(1.3);box-shadow:0 0 28px 20px #ffda6caa}}@keyframes spark{0%{opacity:0;transform:scale(.3) translateY(12px)}25%{opacity:1}100%{opacity:0;transform:scale(1.2) translateY(-55px)}}@media(max-width:600px){header{padding-top:12px}.toolbar{gap:2px 12px;padding:5px 10px}.control{gap:6px;font-size:.85rem}.control input{width:86px}.canvas-wrap{max-height:calc(100svh - 285px)}.bottom{padding:10px 12px 14px}.status{font-size:.95rem;min-height:2.8em}.buttons{gap:10px}.primary,.secondary{flex:1;padding:10px 12px!important}.help{margin-top:10px}.scene{border-radius:16px}.discovery-title{font-size:1rem}}@media(max-height:500px) and (orientation:landscape){header{padding:8px 12px 0}h1{font-size:1.2rem;display:inline;margin-right:18px}header p{display:inline;font-size:.9rem}.toolbar{padding:3px 10px}.canvas-wrap{max-height:65svh}.bottom{padding:8px 12px}.status{min-height:1.4em}.help{margin:8px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.item[data-id="house"] .sprite,.item[data-id="lantern"] .sprite{filter:drop-shadow(1px 0 0 #684451) drop-shadow(-1px 0 0 #684451) drop-shadow(0 1px 0 #684451) drop-shadow(0 -1px 0 #684451) drop-shadow(0 2px 3px #49304455)}
</style><style>#grow,#reset,.help,.subtext,.badge,.eyebrow{display:none!important}.discovery-title{white-space:normal!important;width:max-content;max-width:90vw}header{padding-top:10px}.canvas-wrap{max-height:none!important}</style><style>.control,.help,.hint,.countrow,.world-note,.step-label{font-size:1em!important}.control input{min-height:44px}.canvas-wrap{overflow:auto}.scene{flex-shrink:0}</style></head><body>
<header><h1>Dein rosa Zauberbaum</h1><p>Nach jeder Runde wartet eine neue Entdeckung.</p></header>
<div class="toolbar"><label class="control">Baum <input id="treeSize" type="range" min="80" max="180" value="100" step="10" aria-label="Baumgröße"><output id="treeValue">100 %</output></label><label class="control">Schrift <input id="textSize" type="range" min="100" max="150" value="100" step="10" aria-label="Schriftgröße"><output id="textValue">100 %</output></label></div>
<main><div class="canvas-wrap" id="canvasWrap"><div class="scene" id="scene" role="group" aria-label="Rosa Blütenbaum mit zehn entdeckbaren Zauberelementen"></div></div>
<div class="bottom"><div class="progress"><span id="count">0 von 10</span><div class="dots" aria-hidden="true"></div></div><p class="status" id="status" aria-live="polite">Was sich wohl in deinem Blütenbaum versteckt?</p><div class="buttons"><button class="primary" id="grow">Lass etwas wachsen ✨</button><button class="secondary" id="reset">Von vorn</button></div><p class="help">In dieser Vorschau ersetzt ein Klick eine gespielte Runde.<br>Entdeckte Dinge kannst du noch einmal antippen.</p></div></main><div class="veil" id="veil"></div>
<script>
const items=[
{id:'door',name:'Die goldene Feentür',x:45,y:73,w:26,col:0,row:0,message:'Eine Feentür! Tippe sie an und lass das Licht heraus.'},
{id:'house',name:'Das Blütenhäuschen',x:70,y:37,w:40,col:1,row:0,message:'Ein Blütenhäuschen zwischen den Zweigen.'},
{id:'ladder',name:'Die Perlenleiter',x:69,y:63,w:30,col:2,row:0,message:'Eine Perlenleiter führt zum Blütenhäuschen.'},
{id:'moon',name:'Die Mondsichel-Schaukel',x:23,y:65,w:40,col:3,row:0,message:'Eine goldene Mondsichel lädt zum Schaukeln ein.'},
{id:'butterfly',name:'Der Zauberschmetterling',x:85,y:89,w:15,col:4,row:0,message:'Ein schillernder Schmetterling landet im Gras.'},
{id:'bird',name:'Der kleine Blütenvogel',x:25,y:29,w:34,col:0,row:1,message:'Ein Blütenvogel macht es sich im Nest gemütlich.'},
{id:'lantern',name:'Die Sternenlaterne',x:86,y:64,w:15,col:1,row:1,message:'Die Sternenlaterne bringt warmen Glanz in den Baum.'},
{id:'crystal',name:'Die Zauberkristalle',x:68,y:87,w:16,col:2,row:1,message:'An den Wurzeln funkeln zarte Zauberkristalle.'},
{id:'mushrooms',name:'Die Leuchtpilze',x:25,y:87,w:17,col:3,row:1,message:'Drei Leuchtpilze lassen die Wiese schimmern.'},
{id:'fox',name:'Der schlafende Fuchs',x:49,y:89,w:22,col:4,row:1,message:'Ein kleiner Fuchs träumt unter deinem fertigen Zauberbaum.'}
];
const scene=document.querySelector('#scene'),wrap=document.querySelector('#canvasWrap'),grow=document.querySelector('#grow'),reset=document.querySelector('#reset'),status=document.querySelector('#status'),count=document.querySelector('#count'),veil=document.querySelector('#veil'),treeSize=document.querySelector('#treeSize'),textSize=document.querySelector('#textSize');let step=0,busy=false,run=0,animations=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)');
items.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='item';b.dataset.id=item.id;b.setAttribute('aria-label',item.name);b.tabIndex=-1;b.style.cssText=`--x:${item.x};--y:${item.y};--w:${item.w};--bx:${item.col*25}%;--by:${item.row*100}%`;b.innerHTML=(i===0?'<span class="door-light"></span>':'')+'<span class="sprite"></span>';b.addEventListener('click',()=>interact(b,item));scene.append(b);item.el=b;const dot=document.createElement('span');dot.className='dot';document.querySelector('.dots').append(dot)});
function sizeScene(){const landscape=innerWidth>innerHeight&&innerHeight<500;const target=Math.min(innerWidth-16,landscape?innerHeight*.58:Math.max(260,innerHeight-380)*8/9,660);scene.style.setProperty('--scene-width',`${Math.round(target*Number(treeSize.value)/100)}px`)}
function sparks(item){if(reduced.matches)return;for(let i=0;i<12;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%3?'✦':'✧';s.style.left=`${item.x+(Math.random()-.5)*item.w*1.4}%`;s.style.top=`${item.y+(Math.random()-.5)*item.w}%`;s.style.animationDelay=`${Math.random()*.5}s`;scene.append(s);setTimeout(()=>s.remove(),2200)}}
function interact(el,item){if(busy)return;if(item.id==='door'){el.classList.toggle('open');el.setAttribute('aria-expanded',el.classList.contains('open'));status.textContent=el.classList.contains('open')?'Goldenes Licht strömt aus der Feentür.':'Die Feentür ist wieder zu.'}else{el.classList.remove('active');void el.offsetWidth;el.classList.add('active');status.textContent=item.message}sparks(item)}
function lock(value){busy=value;grow.disabled=value||step===10;treeSize.disabled=value;textSize.disabled=value}
async function reveal(){if(busy||step>=items.length)return;lock(true);const token=++run,item=items[step],el=item.el;el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});const target=el.getBoundingClientRect();if(!reduced.matches){const clone=document.createElement('div');clone.className='discovery';clone.style.cssText=`--bx:${item.col*25}%;--by:${item.row*100}%;left:${target.left}px;top:${target.top}px;width:${target.width}px;height:${target.height}px`;clone.innerHTML='<span class="sprite"></span>';const title=document.createElement('div');title.className='discovery-title';title.textContent=item.name;const bigH=Math.min(360,innerHeight*.48,innerWidth*1.05),scale=bigH/target.height,cx=innerWidth/2-target.width/2,cy=innerHeight*.43-target.height/2;title.style.top=`${Math.min(innerHeight-70,innerHeight*.43+bigH/2+22)}px`;document.body.append(clone,title);veil.classList.add('show');const anim=clone.animate([{transform:`translate(${cx-target.left}px,${cy-target.top}px) scale(${scale*.9})`,opacity:1,offset:0},{transform:`translate(${cx-target.left}px,${cy-target.top}px) scale(${scale})`,opacity:1,offset:.18},{transform:`translate(${cx-target.left}px,${cy-target.top}px) scale(${scale})`,opacity:1,offset:.62},{transform:'translate(0,0) scale(1)',opacity:1,offset:1}],{duration:2600,easing:'ease-in-out',fill:'forwards'});animations.push(anim);try{await anim.finished}catch{}clone.remove();title.remove();veil.classList.remove('show');animations=animations.filter(a=>a!==anim);if(token!==run)return}
el.classList.add('visible');el.tabIndex=0;step++;count.textContent=`${step} von 10`;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('done',i<step));status.textContent=item.message;if(item.id==='door'){el.classList.add('open');el.setAttribute('aria-expanded','true')}else{el.classList.add('active')}sparks(item);if(step===10)grow.textContent='Dein Baum ist vollständig ✨';lock(false)}
grow.addEventListener('click',reveal);reset.addEventListener('click',()=>{run++;animations.forEach(a=>a.cancel());animations=[];document.querySelectorAll('.discovery,.discovery-title,.spark').forEach(e=>e.remove());veil.classList.remove('show');items.forEach(i=>{i.el.classList.remove('visible','active','open');i.el.tabIndex=-1;if(i.id==='door')i.el.setAttribute('aria-expanded','false')});step=0;count.textContent='0 von 10';document.querySelectorAll('.dot').forEach(d=>d.classList.remove('done'));status.textContent='Was sich wohl in deinem Blütenbaum versteckt?';grow.textContent='Lass etwas wachsen ✨';lock(false)});treeSize.addEventListener('input',()=>{document.querySelector('#treeValue').textContent=treeSize.value+' %';sizeScene()});textSize.addEventListener('input',()=>{document.querySelector('#textValue').textContent=textSize.value+' %';document.documentElement.style.fontSize=20*Number(textSize.value)/100+'px'});window.addEventListener('resize',sizeScene);sizeScene();
</script><script src="../bridge.js"></script></body></html>
