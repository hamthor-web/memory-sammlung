name: Four per-child reward trees
on:
  pull_request:
  push:
    paths:
      - 'wortmemory/**'
      - 'tests/*word-tree*'
      - 'scripts/production-files.cjs'
      - '.github/workflows/test-word-trees.yml'
permissions:
  contents: read
jobs:
  tree-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser library
        run: npm install --no-save --no-package-lock playwright
      - name: Select Chromium
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            npx playwright install --with-deps chromium
            CHROME=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Verify stored progress and production files
        run: |
          node tests/word-tree-store.cjs
          node tests/word-tree-backup.cjs
          node tests/word-tree-assets.cjs
          node scripts/build-production.cjs
          node tests/production-package.cjs
          node verify-pwa.cjs
      - name: Start production app
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > /tmp/tree-server.log 2>&1 &
          sleep 2
      - name: Play full round and inspect four trees on phone and tablet
        run: node tests/browser-word-trees.cjs
      - name: Save screen checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-trees-screen-checks
          path: /tmp/word-trees/
          if-no-files-found: ignore
