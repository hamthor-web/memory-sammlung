name: Repair Memory collection layout and navigation
on:
  push:
    paths:
      - '.github/workflows/repair-memory-navigation-20261107.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository without discarding newer changes
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node for repository tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make checked, scoped repairs and run tests
        run: python3 scripts/fix_memory_back_and_setup_20261107.py
      - name: Commit only approved presentation and navigation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- verrueckt-gesucht/index.html eigenschaften.html synonymmemory/index.html wortmemory/index.html wortmemory/test-zweispieler-2026-11-06.html menu.css sw.js
          git diff --cached --check -- menu.css sw.js eigenschaften.html synonymmemory/index.html
          git commit -m "Fix Verrueckt setup order and uniform buttons; make Android back return to collection"
          git push origin HEAD:main
