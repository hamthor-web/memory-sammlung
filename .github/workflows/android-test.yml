name: Android test APK
on:
  pull_request:
  workflow_dispatch:
    inputs:
      prepared_apk:
        description: 'Optional transfer manifest of an already locally signed APK (no signing key)'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'package*.json', '**.js', '**.html', '**.css', 'assets/**', '.github/workflows/android-test.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore stable test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
          EVENT_NAME: ${{ github.event_name }}
          PREPARED_APK: ${{ inputs.prepared_apk }}
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/memory-test.jks"
            chmod 600 "$RUNNER_TEMP/memory-test.jks"
            echo "MEMORY_TEST_KEYSTORE=$RUNNER_TEMP/memory-test.jks" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$PREPARED_APK" ]; then
            echo 'The stable test signing key is required for delivery.'
            exit 1
          fi
      - name: Copy local production assets
        run: npm run android:sync
      - name: Build and lint test version
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug bundleRelease
      - name: Verify every offline game file in APK and AAB
        run: python3 tests/android-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: memory-lesen-android-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

  deliver:
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memory-lesen-android-test
          path: test-apk
      - name: Attach test APK to private draft
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ inputs.prepared_apk }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export ANDROID_APK_NAME="Memory-Sammlung-${VERSION}-test.apk"
          TAG="android-test-${VERSION}"
          if [ -n "$PREPARED_APK" ]; then
            python3 scripts/restore-test-apk.py
          else
            cp test-apk/outputs/apk/debug/app-debug.apk "$ANDROID_APK_NAME"
          fi
          sha256sum "$ANDROID_APK_NAME" > "$ANDROID_APK_NAME.sha256"
          cp docs/android-installation.md START-HIER.md
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Memory-Sammlung ${VERSION} – Android-Test" --notes "Lokale Testversion. Keine Play-Store-Veröffentlichung."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ANDROID_APK_NAME" "$ANDROID_APK_NAME.sha256" START-HIER.md
