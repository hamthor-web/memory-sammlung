name: Android test APK
on:
  pull_request:
  workflow_dispatch:
    inputs:
      diagnose_install:
        description: 'Install the exact prepared APK on Android 17, without changing the release'
        required: false
        type: boolean
        default: false
      prepared_apk:
        description: 'Optional transfer manifest of an already locally signed APK (no signing key)'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'package*.json', '**.js', '**.html', '**.css', 'assets/**', '.github/workflows/android-test.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore stable test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
          EVENT_NAME: ${{ github.event_name }}
          PREPARED_APK: ${{ inputs.prepared_apk }}
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/memory-test.jks"
            chmod 600 "$RUNNER_TEMP/memory-test.jks"
            echo "MEMORY_TEST_KEYSTORE=$RUNNER_TEMP/memory-test.jks" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$PREPARED_APK" ]; then
            echo 'The stable test signing key is required for delivery.'
            exit 1
          fi
      - name: Copy local production assets
        run: npm run android:sync
      - name: Build and lint test version
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: memory-lesen-android-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

  deliver:
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memory-lesen-android-test
          path: test-apk
      - name: Prepare exact test APK
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ inputs.prepared_apk }}
        run: |
          if [ -n "$PREPARED_APK" ]; then
            python3 scripts/restore-test-apk.py
          else
            cp test-apk/outputs/apk/debug/app-debug.apk Memory-Lesen-0.1.0-test.apk
          fi
          sha256sum Memory-Lesen-0.1.0-test.apk > Memory-Lesen-0.1.0-test.apk.sha256
          cp docs/android-installation.md START-HIER.md
      - uses: actions/setup-java@v4
        if: inputs.diagnose_install
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: inputs.diagnose_install
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools emulator system-images;android-37.0;aosp_atd;x86_64'
      - name: Install on Android 17
        if: inputs.diagnose_install
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --force -n memory_android17 -k 'system-images;android-37.0;aosp_atd;x86_64'
          emulator -avd memory_android17 -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader -memory 2048 -cores 2 -port 5580 > android17-emulator.log 2>&1 &
          adb -s emulator-5580 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5580 shell getprop ro.build.version.release
          adb -s emulator-5580 install -r Memory-Lesen-0.1.0-test.apk | tee android17-install.txt
          adb -s emulator-5580 shell pm path de.heikeamthor.lesespiele.test
          adb -s emulator-5580 shell am start -W -n de.heikeamthor.lesespiele.test/de.heikeamthor.lesespiele.MainActivity | tee android17-launch.txt
          sleep 10
          adb -s emulator-5580 shell pidof de.heikeamthor.lesespiele.test
          adb -s emulator-5580 logcat -d > android17-logcat.txt
          adb -s emulator-5580 exec-out screencap -p > android17-screen.png
      - uses: actions/upload-artifact@v4
        if: always() && inputs.diagnose_install
        with:
          name: android17-installation
          path: |
            android17-*.txt
            android17-*.log
            android17-screen.png
      - name: Attach test APK to private draft
        if: ${{ !inputs.diagnose_install }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit android-test-0.1.0 --repo "$GITHUB_REPOSITORY" --draft=true --target "$GITHUB_SHA"
          gh release upload android-test-0.1.0 --repo "$GITHUB_REPOSITORY" --clobber Memory-Lesen-0.1.0-test.apk Memory-Lesen-0.1.0-test.apk.sha256 START-HIER.md
