name: Profile progress and complete offline games
on:
  pull_request:
  push:
    paths:
      - '**.js'
      - '**.cjs'
      - '**.html'
      - '**.css'
      - 'assets/**'
      - 'verrueckt-gesucht/assets/**'
      - '.github/workflows/test-profile-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save --no-package-lock playwright
      - name: Select Chromium
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            npx playwright install --with-deps chromium
            CHROME=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Build production-only web assets
        run: node scripts/build-production.cjs
      - name: Check logic, data migration and safe updates
        run: |
          node tests/production-package.cjs
          node tests/app-identity.cjs
          node verify.cjs
          node verify-pwa.cjs
          node tests/progress-store.cjs
          node tests/backup-store.cjs
          node tests/profile-store.cjs
          node tests/reward-history.cjs
          node tests/service-worker-update.cjs
          node tests/puzzle-cut-coverage.cjs
      - name: Require the checked-in offline manifest to match the application
        run: |
          node scripts/build-offline.cjs
          git diff --exit-code -- offline-files.js collection-session.js verrueckt-gesucht/app-release-*.js verrueckt-gesucht/style-release-*.css
      - name: Start local app
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > /tmp/memory-profile-server.log 2>&1 &
          sleep 2
      - name: Recover an interrupted update without losing local profiles
        run: node tests/browser-update-recovery.cjs
      - name: Check existing puzzle layouts after cut correction
        run: |
          node tests/browser-knurpsel-migration.cjs
          node tests/browser-puzzle-assembly.cjs
      - name: Check all menu transitions
        run: node tests/browser-memory-four-games.cjs
      - name: Check consistent mobile navigation and reading windows
        run: |
          node tests/browser-navigation.cjs
          node tests/browser-app-info.cjs
          node tests/browser-backup.cjs
          node tests/browser-native-shell.cjs
          node tests/browser-reading-back.cjs
      - name: Check profiles, rules, handovers and round recovery
        run: node tests/browser-progress.cjs
      - name: Start with cached old HTML and current game code
        run: node tests/browser-cached-gallery.cjs
      - name: Check saved artwork versions and repeat counts
        run: node tests/browser-reward-history.cjs
      - name: Recover all eleven reward stories
        run: node tests/browser-reward-resume.cjs
      - name: Check external artwork and legacy image references
        run: node tests/browser-production-assets.cjs
      - name: First-ever offline start of all four games
        run: node tests/browser-offline.cjs
