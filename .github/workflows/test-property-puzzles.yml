name: Properties puzzle rewards
on:
  push:
    branches: [feat/property-puzzle-rewards, feat/property-puzzle-assembly]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  puzzles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save --no-package-lock playwright
      - name: Select Chromium
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            npx playwright install --with-deps chromium
            CHROME=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Build and check offline package
        run: |
          node scripts/build-production.cjs
          node tests/property-puzzles.cjs
          node tests/progress-store.cjs
          node tests/backup-store.cjs
          node verify-pwa.cjs
          git diff --exit-code -- offline-files.js
      - name: Start local app
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > /tmp/puzzles-server.log 2>&1 &
          sleep 2
      - name: Play every reward difficulty, resume and check screens
        run: |
          node tests/browser-property-puzzles.cjs
          node tests/browser-puzzle-assembly.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-screenshots
          path: |
            /tmp/puzzle-*.png
            /tmp/assembly-*.png
